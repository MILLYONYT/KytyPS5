name: PR558 Demon Souls Diagnostic Windows Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr558-windows-build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout PR558 Demon Souls diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: demons-souls-pr558-test
          submodules: recursive
          fetch-depth: 0

      - name: Fix Windows min macro collision in diagnostics
        shell: pwsh
        run: |
          $path = "src/common/hostException.cpp"
          $text = Get-Content $path -Raw
          $text = $text.Replace("current = std::min(region_end, end);", "current = (region_end < end ? region_end : end);")
          Set-Content -Path $path -Value $text -NoNewline

      - name: Balance texture GC under VRAM pressure
        shell: pwsh
        run: |
          $path = "src/graphics/host_gpu/renderer/cache/textureCache.cpp"
          $text = Get-Content $path -Raw
          $oldAge = "const uint64_t age       = std::min<uint64_t>(aggressive ? 160 : pressured ? 80 : 16, tick);"
          $newAge = "const uint64_t age       = std::min<uint64_t>(aggressive ? 64 : pressured ? 32 : 16, tick);"
          $oldDelete = "size_t         deletions = aggressive ? 40 : pressured ? 20 : 10;"
          $newDelete = "size_t         deletions = aggressive ? 80 : pressured ? 40 : 10;"
          if (-not $text.Contains($oldAge)) { throw "texture GC age block not found" }
          if (-not $text.Contains($oldDelete)) { throw "texture GC deletion block not found" }
          $text = $text.Replace($oldAge, $newAge)
          $text = $text.Replace($oldDelete, $newDelete)
          Set-Content -Path $path -Value $text -NoNewline

      - name: Add shader and pipeline performance logging
        shell: pwsh
        run: |
          $path = "src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp"
          $text = Get-Content $path -Raw

          $old = '#include <atomic>'
          $new = "#include <atomic>`n#include <chrono>"
          if (-not $text.Contains($old)) { throw "atomic include not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          		auto translated = ShaderRecompiler::TranslateProgram(params.code, options);
          '@
          $new = @'
          		static uint64_t perf_shader_hits = 0;
          		static uint64_t perf_shader_new = 0;
          		static double perf_shader_total_ms = 0.0;
          		static double perf_shader_max_ms = 0.0;
          		const auto perf_shader_begin = std::chrono::steady_clock::now();
          		auto translated = ShaderRecompiler::TranslateProgram(params.code, options);
          '@
          if (-not $text.Contains($old)) { throw "shader translate block not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          				permutation->program.bindings.AdvancePushData(push_data_cursor);
          				return permutation->handle;
          '@
          $new = @'
          				permutation->program.bindings.AdvancePushData(push_data_cursor);
          				++perf_shader_hits;
          				return permutation->handle;
          '@
          if (-not $text.Contains($old)) { throw "shader cache hit block not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          		entry->second.permutations.push_back(CompilePermutation(
          		    params, options, std::move(translated), std::move(specialization), push_data_cursor));
          		const auto& permutation = entry->second.permutations.back();
          '@
          $new = @'
          		entry->second.permutations.push_back(CompilePermutation(
          		    params, options, std::move(translated), std::move(specialization), push_data_cursor));
          		const auto perf_shader_end = std::chrono::steady_clock::now();
          		const double perf_shader_ms = std::chrono::duration<double, std::milli>(
          		    perf_shader_end - perf_shader_begin).count();
          		++perf_shader_new;
          		perf_shader_total_ms += perf_shader_ms;
          		perf_shader_max_ms = std::max(perf_shader_max_ms, perf_shader_ms);
          		if ((perf_shader_new & 15u) == 0 || perf_shader_ms >= 50.0) {
          			std::printf("[PERF] shader_new stage=%s new=%llu hits=%llu last_ms=%.3f avg_ms=%.3f max_ms=%.3f total_ms=%.3f\n",
          			            label, static_cast<unsigned long long>(perf_shader_new),
          			            static_cast<unsigned long long>(perf_shader_hits), perf_shader_ms,
          			            perf_shader_total_ms / static_cast<double>(perf_shader_new),
          			            perf_shader_max_ms, perf_shader_total_ms);
          		}
          		const auto& permutation = entry->second.permutations.back();
          '@
          if (-not $text.Contains($old)) { throw "shader compile block not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          	if (auto iter = m_graphics_pipelines.find(key); iter != m_graphics_pipelines.end()) {
          		return *iter->second;
          	}
          '@
          $new = @'
          	static uint64_t perf_gfx_hits = 0;
          	static uint64_t perf_gfx_new = 0;
          	static double perf_gfx_total_ms = 0.0;
          	static double perf_gfx_max_ms = 0.0;
          	if (auto iter = m_graphics_pipelines.find(key); iter != m_graphics_pipelines.end()) {
          		++perf_gfx_hits;
          		return *iter->second;
          	}
          '@
          if (-not $text.Contains($old)) { throw "graphics pipeline hit block not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          	auto cached = std::make_unique<Pipeline>();
          	LogPipelineTrace("CreatePipelineInternal begin", vs_id, ps_id);
          	CreatePipelineInternal(m_graphics, *cached, rendering, key.vertex_input, vs_input_info,
          	                       vertex_program, ps_input_info, pixel_program, static_params,
          	                       m_driver_cache);
          	LogPipelineTrace("CreatePipelineInternal done", vs_id, ps_id);
          '@
          $new = @'
          	auto cached = std::make_unique<Pipeline>();
          	const auto perf_gfx_begin = std::chrono::steady_clock::now();
          	LogPipelineTrace("CreatePipelineInternal begin", vs_id, ps_id);
          	CreatePipelineInternal(m_graphics, *cached, rendering, key.vertex_input, vs_input_info,
          	                       vertex_program, ps_input_info, pixel_program, static_params,
          	                       m_driver_cache);
          	LogPipelineTrace("CreatePipelineInternal done", vs_id, ps_id);
          	const double perf_gfx_ms = std::chrono::duration<double, std::milli>(
          	    std::chrono::steady_clock::now() - perf_gfx_begin).count();
          	++perf_gfx_new;
          	perf_gfx_total_ms += perf_gfx_ms;
          	perf_gfx_max_ms = std::max(perf_gfx_max_ms, perf_gfx_ms);
          	if ((perf_gfx_new & 15u) == 0 || perf_gfx_ms >= 25.0) {
          		std::printf("[PERF] gfx_pipeline new=%llu hits=%llu last_ms=%.3f avg_ms=%.3f max_ms=%.3f total_ms=%.3f\n",
          		            static_cast<unsigned long long>(perf_gfx_new),
          		            static_cast<unsigned long long>(perf_gfx_hits), perf_gfx_ms,
          		            perf_gfx_total_ms / static_cast<double>(perf_gfx_new),
          		            perf_gfx_max_ms, perf_gfx_total_ms);
          	}
          '@
          if (-not $text.Contains($old)) { throw "graphics pipeline create block not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          	if (auto iter = m_compute_pipelines.find(compute_program.id);
          	    iter != m_compute_pipelines.end()) {
          		return *iter->second;
          	}
          '@
          $new = @'
          	static uint64_t perf_compute_hits = 0;
          	static uint64_t perf_compute_new = 0;
          	static double perf_compute_total_ms = 0.0;
          	static double perf_compute_max_ms = 0.0;
          	if (auto iter = m_compute_pipelines.find(compute_program.id);
          	    iter != m_compute_pipelines.end()) {
          		++perf_compute_hits;
          		return *iter->second;
          	}
          '@
          if (-not $text.Contains($old)) { throw "compute pipeline hit block not found" }
          $text = $text.Replace($old, $new)

          $old = @'
          	auto cached = std::make_unique<Pipeline>();
          	CreatePipelineInternal(m_graphics, *cached, input_info, compute_program.module, m_driver_cache);
          '@
          $new = @'
          	auto cached = std::make_unique<Pipeline>();
          	const auto perf_compute_begin = std::chrono::steady_clock::now();
          	CreatePipelineInternal(m_graphics, *cached, input_info, compute_program.module, m_driver_cache);
          	const double perf_compute_ms = std::chrono::duration<double, std::milli>(
          	    std::chrono::steady_clock::now() - perf_compute_begin).count();
          	++perf_compute_new;
          	perf_compute_total_ms += perf_compute_ms;
          	perf_compute_max_ms = std::max(perf_compute_max_ms, perf_compute_ms);
          	if ((perf_compute_new & 15u) == 0 || perf_compute_ms >= 25.0) {
          		std::printf("[PERF] compute_pipeline new=%llu hits=%llu last_ms=%.3f avg_ms=%.3f max_ms=%.3f total_ms=%.3f\n",
          		            static_cast<unsigned long long>(perf_compute_new),
          		            static_cast<unsigned long long>(perf_compute_hits), perf_compute_ms,
          		            perf_compute_total_ms / static_cast<double>(perf_compute_new),
          		            perf_compute_max_ms, perf_compute_total_ms);
          	}
          '@
          if (-not $text.Contains($old)) { throw "compute pipeline create block not found" }
          $text = $text.Replace($old, $new)

          Set-Content -Path $path -Value $text -NoNewline

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 ^
            -DKYTY_RELEASE_TAG=KytyPS5-PR558-DS-perf-shader-pipeline ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        shell: cmd
        run: cmake --build _Build/windows --target launcher --parallel

      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-PR558-DS-Perf-ShaderPipeline
          path: _Build/windows/install/**
          if-no-files-found: error
