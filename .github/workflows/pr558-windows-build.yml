name: PR558 Demon Souls Diagnostic Windows Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr558-windows-build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout PR558 Demon Souls diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: demons-souls-pr558-test
          submodules: recursive
          fetch-depth: 0

      - name: Fix Windows min macro collision in diagnostics
        shell: pwsh
        run: |
          $path = "src/common/hostException.cpp"
          $text = Get-Content $path -Raw
          $text = $text.Replace("current = std::min(region_end, end);", "current = (region_end < end ? region_end : end);")
          Set-Content -Path $path -Value $text -NoNewline

      - name: Add image creation failure diagnostics
        shell: pwsh
        run: |
          $path = "src/graphics/host_gpu/renderer/image/image.cpp"
          $text = Get-Content $path -Raw
          $pattern = '(?s)\tif \(!graphics\.CreateImage\(create, backing\)\) \{.*?\r?\n\t\}'
          $new = @'
	if (!graphics.CreateImage(create, backing)) {
		EXIT("failed to create image:\n"
		     " create: extent=%ux%ux%u format=%d type=%d layers=%u levels=%u usage=0x%x flags=0x%x samples=0x%x\n"
		     " limits: maxExtent=%ux%ux%u maxMipLevels=%u maxArrayLayers=%u sampleCounts=0x%x maxResourceSize=0x%016llx\n"
		     " guest: format=%u type=%u pitch=%u bytesPerBlock=%u samples=%u tileMode=%u data=0x%016llx+0x%016llx stencil=0x%016llx+0x%016llx\n"
		     " metadata: kind=%u range=0x%016llx+0x%016llx control=0x%08x compression=%u stencilCompressed=%u\n",
		     create.extent.width, create.extent.height, create.extent.depth,
		     static_cast<int>(create.format), static_cast<int>(create.imageType), create.arrayLayers,
		     create.mipLevels, static_cast<vk::ImageUsageFlags::MaskType>(create.usage),
		     static_cast<vk::ImageCreateFlags::MaskType>(create.flags),
		     static_cast<vk::SampleCountFlags::MaskType>(create.samples), properties.maxExtent.width,
		     properties.maxExtent.height, properties.maxExtent.depth, properties.maxMipLevels,
		     properties.maxArrayLayers, static_cast<vk::SampleCountFlags::MaskType>(properties.sampleCounts),
		     static_cast<unsigned long long>(properties.maxResourceSize),
		     static_cast<uint32_t>(info.guest_format), static_cast<uint32_t>(info.type), info.pitch,
		     info.bytes_per_block, info.samples, static_cast<uint32_t>(info.tile_mode),
		     static_cast<unsigned long long>(info.data.address), static_cast<unsigned long long>(info.data.size),
		     static_cast<unsigned long long>(info.stencil.address), static_cast<unsigned long long>(info.stencil.size),
		     static_cast<uint32_t>(info.metadata.kind),
		     static_cast<unsigned long long>(info.metadata.range.address),
		     static_cast<unsigned long long>(info.metadata.range.size), info.metadata.control,
		     static_cast<uint32_t>(info.metadata.compression), info.metadata.stencil_compressed ? 1u : 0u);
	}
'@
          $updated = [regex]::Replace($text, $pattern, $new, 1)
          if ($updated -eq $text) { throw "Image failure block not found" }
          Set-Content -Path $path -Value $updated -NoNewline

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 ^
            -DKYTY_RELEASE_TAG=KytyPS5-PR558-DS-diagnostics ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        shell: cmd
        run: cmake --build _Build/windows --target launcher --parallel

      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-PR558-DS-Diagnostics
          path: _Build/windows/install/**
          if-no-files-found: error
