name: Build and Release KytyPS5

# General cross-platform builds are manual-only while the Demon Souls
# experimental workflow iterates on Windows. This prevents every diagnostic
# commit on main from also launching Windows/Linux/macOS release builds.
on:
  workflow_dispatch:

env:
  KYTY_BUILD_ORIGIN: ${{ github.repository != 'KytyPS5/KytyPS5' && 'Fork' || github.event_name == 'push' && 'Official' || 'Source' }}
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - name: Generate release tag
        id: release_tag
        shell: bash
        run: |
          echo "value=KytyPS5-$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  windows:
    name: Build KytyPS5 (Windows)
    needs: metadata
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=${{ env.KYTY_BUILD_ORIGIN }} ^
            -DKYTY_BUILD_REPOSITORY=${{ env.KYTY_BUILD_REPOSITORY }} ^
            -DKYTY_RELEASE_TAG=${{ needs.metadata.outputs.release_tag }} ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        shell: cmd
        run: cmake --build _Build/windows --target launcher --parallel

      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64
          path: _Build/windows/install/**
          if-no-files-found: error

  linux:
    name: Build KytyPS5 (Linux)
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libvulkan-dev glslang-tools

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B _Build/linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN=${{ env.KYTY_BUILD_ORIGIN }} \
            -DKYTY_BUILD_REPOSITORY=${{ env.KYTY_BUILD_REPOSITORY }} \
            -DKYTY_RELEASE_TAG=${{ needs.metadata.outputs.release_tag }} \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      - name: Build
        shell: bash
        run: cmake --build _Build/linux --target launcher --parallel

      - name: Install
        shell: bash
        run: cmake --install _Build/linux --prefix _Build/linux/install

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Linux-x64
          path: _Build/linux/install/**
          if-no-files-found: error

  macos:
    name: Build KytyPS5 (macOS)
    needs: metadata
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install dependencies
        shell: bash
        run: brew install glslang

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B _Build/macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DKYTY_BUILD_ORIGIN=${{ env.KYTY_BUILD_ORIGIN }} \
            -DKYTY_BUILD_REPOSITORY=${{ env.KYTY_BUILD_REPOSITORY }} \
            -DKYTY_RELEASE_TAG=${{ needs.metadata.outputs.release_tag }} \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      - name: Build
        shell: bash
        run: cmake --build _Build/macos --target launcher --parallel

      - name: Install
        shell: bash
        run: cmake --install _Build/macos --prefix _Build/macos/install

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-macOS-x64
          path: _Build/macos/install/**
          if-no-files-found: error
