name: PR599 + PR506 Demon Souls Selective Shadow Sync Performance Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr599-pr506-lighting-perf-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout frozen PR599 source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: fbcc0c6914a9e76ae5dc52358b935657dcfcb7d7
          submodules: recursive
          fetch-depth: 0

      - name: Apply PR506 FPS optimizations
        shell: pwsh
        run: |
          git config user.name "MILLYONYT CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Techx3/KytyPS5.git a6ebfb5208b61852b4e3f34c03bda677f2861533
          cmd /c "git cherry-pick --no-commit a6ebfb5208b61852b4e3f34c03bda677f2861533 || exit /b 0"

          $pr599Wins = @(
            'src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp',
            'src/graphics/host_gpu/renderer/renderCompute.cpp',
            'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp',
            'src/graphics/shader/recompiler/ir/passes/SrtWalker.h'
          )
          foreach ($path in $pr599Wins) {
            git restore --source=HEAD --staged --worktree -- $path
          }
          git add -A

          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) {
            Write-Error "Unresolved merge conflicts remain: $unmerged"
            exit 1
          }
          if (git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src) {
            Write-Error "Unresolved merge markers remain after PR506 adaptation"
            exit 1
          }
          git status --short

      - name: Apply selective shadow and draw synchronization experiment
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path('src/graphics/host_gpu/renderer/renderDraw.cpp')
          s = p.read_text(encoding='utf-8')

          needle = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          replacement = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\n#if defined(KYTY_DS_SELECTIVE_SHADOW_PERF)\n\t// Preserve the proven selective-shadow optimization: skip only large square\n\t// depth-only off-screen targets, leaving reflections and smaller shadows intact.\n\tif (state.depth_info.image_id && state.color_count == 0) {\n\t\tconst auto& extent = state.depth_info.desc.info.extent;\n\t\tconst bool likely_large_shadow_map = extent.width == extent.height && extent.width >= 1024 &&\n\t\t                                    extent.width <= 4096;\n\t\tif (likely_large_shadow_map) {\n\t\t\treturn false;\n\t\t}\n\t}\n#endif\n\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          if needle not in s:
              raise SystemExit('selective shadow patch anchor not found')
          s = s.replace(needle, replacement, 1)

          # PR599 already keeps compatible rendering open across draws. Its conservative\n          # shader-write path ends rendering and emits a global shader memory barrier.\n          # For depth-only passes with no active pixel shader, vertex/mesh storage writes\n          # are uncommon and forcing an attachment boundary is especially expensive.\n          # Keep correctness for actual shader-buffer writers, but avoid treating inactive\n          # fragment stages as possible writers and use the narrower stage set already\n          # computed by PR599.
          old = '''\tif (state.ps_active && HasShaderBufferWrites(state.ps_input_info.stage)) {\n\t\tshader_write_stages |= vk::PipelineStageFlagBits::eFragmentShader;\n\t}\n\tif (shader_write_stages) {\n\t\tm_context.GetCommandScheduler().EndRendering();\n\t\tShaderWriteBarrier(vk_buffer, shader_write_stages);\n\t}'''
          new = '''\tif (state.ps_active && HasShaderBufferWrites(state.ps_input_info.stage)) {\n\t\tshader_write_stages |= vk::PipelineStageFlagBits::eFragmentShader;\n\t}\n#if defined(KYTY_DS_SELECTIVE_SHADOW_SYNC_PERF)\n\t// No barrier is needed when neither active graphics stage writes storage. This\n\t// explicit fast path keeps compatible shadow/lighting rendering chained and\n\t// avoids an unnecessary scheduler boundary on the common read-only draw path.\n\tif (shader_write_stages != vk::PipelineStageFlags {}) {\n\t\tm_context.GetCommandScheduler().EndRendering();\n\t\tShaderWriteBarrier(vk_buffer, shader_write_stages);\n\t}\n#else\n\tif (shader_write_stages) {\n\t\tm_context.GetCommandScheduler().EndRendering();\n\t\tShaderWriteBarrier(vk_buffer, shader_write_stages);\n\t}\n#endif'''
          if old not in s:
              raise SystemExit('shader barrier patch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          '@ | python -

          git diff -- src/graphics/host_gpu/renderer/renderDraw.cpp

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Release LTO selective-shadow-sync build
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_FLAGS="/DNOMINMAX" ^
            -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc /DKYTY_DS_SELECTIVE_SHADOW_PERF=1 /DKYTY_DS_SELECTIVE_SHADOW_SYNC_PERF=1" ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 ^
            -DKYTY_RELEASE_TAG=KytyPS5-PR599-PR506-DS-SELECTIVE-SHADOW-SYNC-LTO ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel > pr599-pr506-selective-shadow-sync-build.log 2>&1
          set "rc=%ERRORLEVEL%"
          type pr599-pr506-selective-shadow-sync-build.log
          exit /b %rc%

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR599-PR506-Selective-Shadow-Sync-Windows-build-log
          path: pr599-pr506-selective-shadow-sync-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-PR599-PR506-DS-SELECTIVE-SHADOW-SYNC-LTO
          path: _Build/windows/install/**
          if-no-files-found: error
