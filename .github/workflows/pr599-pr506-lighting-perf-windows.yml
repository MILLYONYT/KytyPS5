name: PR599 + PR506 Demon Souls Build13 + Selective BDA Performance Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr599-pr506-lighting-perf-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout frozen PR599 source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: fbcc0c6914a9e76ae5dc52358b935657dcfcb7d7
          submodules: recursive
          fetch-depth: 0

      - name: Apply PR506 FPS optimizations
        shell: pwsh
        run: |
          git config user.name "MILLYONYT CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Techx3/KytyPS5.git a6ebfb5208b61852b4e3f34c03bda677f2861533
          cmd /c "git cherry-pick --no-commit a6ebfb5208b61852b4e3f34c03bda677f2861533 || exit /b 0"
          $pr599Wins = @(
            'src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp',
            'src/graphics/host_gpu/renderer/renderCompute.cpp',
            'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp',
            'src/graphics/shader/recompiler/ir/passes/SrtWalker.h'
          )
          foreach ($path in $pr599Wins) { git restore --source=HEAD --staged --worktree -- $path }
          git add -A
          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) { Write-Error "Unresolved PR506 merge conflicts remain: $unmerged"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Apply PR562 selective BDA dirty-hint optimization
        shell: pwsh
        run: |
          git fetch https://github.com/MehmetCambaz/KytyPS5.git 02b57e8fdce98f590ef76a899ca9ac4885563737
          cmd /c "git cherry-pick --no-commit 02b57e8fdce98f590ef76a899ca9ac4885563737 || exit /b 0"
          $pr562Wins = @(
            'src/graphics/host_gpu/memoryTracker.cpp',
            'src/graphics/host_gpu/memoryTracker.h',
            'src/graphics/host_gpu/regionManager.h',
            'src/graphics/host_gpu/renderer/cache/bufferCache.cpp',
            'src/graphics/host_gpu/renderer/cache/bufferCache.h',
            'src/graphics/host_gpu/renderer/cache/gpuResourceManager.cpp',
            'src/graphics/host_gpu/renderer/cache/gpuResourceManager.h'
          )
          foreach ($path in $pr562Wins) { git checkout FETCH_HEAD -- $path; git add -- $path }
          # PR506's pm4Handlers/graphicsRun require the PR506 CommandProcessor release-mem batching API.
          git checkout a6ebfb5208b61852b4e3f34c03bda677f2861533 -- src/graphics/guest_gpu/command_processor/commandProcessor.h
          git add -- src/graphics/guest_gpu/command_processor/commandProcessor.h
          git add -A
          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) { Write-Error "Unresolved PR562 merge conflicts remain: $unmerged"; exit 1 }
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src
          if ($LASTEXITCODE -eq 0) { Write-Error "Unresolved merge markers remain"; exit 1 }
          if ($LASTEXITCODE -ne 1) { Write-Error "git grep conflict-marker check failed with exit code $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Restore PR599 LOD stats compatibility
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          h = Path('src/graphics/host_gpu/renderer/cache/bufferCache.h')
          s = h.read_text(encoding='utf-8')
          anchor = '\t[[nodiscard]] Buffer* GetFaultBuffer() noexcept { return m_fault_manager.GetFaultBuffer(); }\n'
          if anchor not in s: raise SystemExit('BufferCache LOD declaration anchor not found')
          s = s.replace(anchor, anchor + '\tvoid ReportLodStats(void* dst, uint32_t size, bool reset);\n', 1)
          h.write_text(s, encoding='utf-8')

          cpp = Path('src/graphics/host_gpu/renderer/cache/bufferCache.cpp')
          s = cpp.read_text(encoding='utf-8')
          anchor = 'BufferCache::BufferCache(GraphicContext& graphics, CommandScheduler& scheduler,'
          if anchor not in s: raise SystemExit('BufferCache constructor anchor not found')
          impl = '''void BufferCache::ReportLodStats(void* dst, uint32_t size, bool reset) {
\tEXIT_IF(dst == nullptr || size != 0x840);
\tauto& command = m_scheduler.Current();
\tcommand.EndRendering();
\tvk::BufferMemoryBarrier barrier {};
\tbarrier.srcAccessMask = vk::AccessFlagBits::eShaderWrite;
\tbarrier.dstAccessMask = vk::AccessFlagBits::eHostRead;
\tbarrier.srcQueueFamilyIndex = barrier.dstQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED;
\tbarrier.buffer = m_lod_stats_buffer.Handle();
\tbarrier.size = 256 * 16;
\tcommand.Handle().pipelineBarrier(vk::PipelineStageFlagBits::eAllCommands,
\t    vk::PipelineStageFlagBits::eHost, {}, 0, nullptr, 1, &barrier, 0, nullptr);
\tm_scheduler.Finish();
\tm_lod_stats_buffer.Invalidate(0, 256 * 16);
\tauto* words = reinterpret_cast<uint32_t*>(m_lod_stats_buffer.Mapped().data());
\tstd::memset(dst, 0, size);
\tconst uint32_t ready = 1;
\tstd::memcpy(dst, &ready, sizeof(ready));
\tfor (uint32_t i = 0; i < 256; ++i) {
\t\tconst uint64_t entry = (uint64_t(words[i * 4] & 15u) << 56u) |
\t\t    (uint64_t(std::min(words[i * 4 + 1], 0xffffffu)) << 32u) | words[i * 4 + 1];
\t\tstd::memcpy(static_cast<uint8_t*>(dst) + 64 + i * 8, &entry, sizeof(entry));
\t\tif (reset) {
\t\t\twords[i * 4] = 15;
\t\t\twords[i * 4 + 1] = words[i * 4 + 2] = words[i * 4 + 3] = 0;
\t\t}
\t}
\tif (reset) m_lod_stats_buffer.Flush(0, 256 * 16);
}

'''
          s = s.replace(anchor, impl + anchor, 1)
          cpp.write_text(s, encoding='utf-8')
          '@ | python -

      - name: Apply frozen Build 13 performance patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          draw = Path('src/graphics/host_gpu/renderer/renderDraw.cpp')
          s = draw.read_text(encoding='utf-8')
          needle = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          replacement = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\n#if defined(KYTY_DS_SELECTIVE_SHADOW_PERF)\n\tif (state.depth_info.image_id && state.color_count == 0) {\n\t\tconst auto& extent = state.depth_info.desc.info.extent;\n\t\tconst bool likely_large_shadow_map = extent.width == extent.height && extent.width >= 1024 && extent.width <= 4096;\n\t\tif (likely_large_shadow_map) { return false; }\n\t}\n#endif\n\n#if defined(KYTY_DS_SAFE_POSTFX_PERF)\n\tif (!state.depth_info.image_id && state.color_count == 1 && state.ps_active) {\n\t\tconst auto& extent = state.color_info[0].desc.info.extent;\n\t\tconst bool likely_small_postfx = extent.width >= 64 && extent.height >= 64 && extent.width <= 1024 && extent.height <= 1024;\n\t\tif (likely_small_postfx) { return false; }\n\t}\n#endif\n\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          if needle not in s: raise SystemExit('Build13 render baseline anchor not found')
          draw.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

          p = Path('src/graphics/host_gpu/renderer/cache/streamBuffer.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''\tconst bool with_bda = bool(flags & vk::BufferUsageFlagBits::eShaderDeviceAddress);\n\tconst VmaAllocationCreateFlags bda_flag =\n\t    with_bda ? VMA_ALLOCATION_CREATE_DEDICATED_MEMORY_BIT : 0;\n\tVmaAllocationCreateInfo allocation_info {};'''
          new = '''\tconst bool with_bda = bool(flags & vk::BufferUsageFlagBits::eShaderDeviceAddress);\n#if defined(KYTY_DS_VMA_SUBALLOC_PERF)\n\tconst VmaAllocationCreateFlags bda_flag =\n\t    (with_bda && size >= (4ull * 1024 * 1024)) ? VMA_ALLOCATION_CREATE_DEDICATED_MEMORY_BIT : 0;\n#else\n\tconst VmaAllocationCreateFlags bda_flag =\n\t    with_bda ? VMA_ALLOCATION_CREATE_DEDICATED_MEMORY_BIT : 0;\n#endif\n\tVmaAllocationCreateInfo allocation_info {};'''
          if old not in s: raise SystemExit('Build13 VMA anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") { vcpkg install glslang[tools,opt]:x64-windows }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Release LTO selective BDA build
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_FLAGS="/DNOMINMAX" -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc /DKYTY_DS_SELECTIVE_SHADOW_PERF=1 /DKYTY_DS_SAFE_POSTFX_PERF=1 /DKYTY_DS_VMA_SUBALLOC_PERF=1" -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 -DKYTY_RELEASE_TAG=KytyPS5-PR599-PR506-DS-B13-BDA-SELECTIVE-LTO -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel > bda-selective-build.log 2>&1
          set "rc=%ERRORLEVEL%"
          type bda-selective-build.log
          exit /b %rc%
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BDA-Selective-Windows-build-log
          path: bda-selective-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-B13-BDA-SELECTIVE-LTO
          path: _Build/windows/install/**
          if-no-files-found: error
