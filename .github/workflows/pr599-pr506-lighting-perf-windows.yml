name: Demon Souls Build39 Sampled Format Backing Flicker Fix Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr599-pr506-lighting-perf-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout frozen PR599 source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: fbcc0c6914a9e76ae5dc52358b935657dcfcb7d7
          submodules: recursive
          fetch-depth: 0

      - name: Apply PR506 FPS optimizations
        shell: pwsh
        run: |
          git config user.name "MILLYONYT CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Techx3/KytyPS5.git a6ebfb5208b61852b4e3f34c03bda677f2861533
          cmd /c "git cherry-pick --no-commit a6ebfb5208b61852b4e3f34c03bda677f2861533 || exit /b 0"
          $pr599Wins = @('src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp','src/graphics/host_gpu/renderer/renderCompute.cpp','src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp','src/graphics/shader/recompiler/ir/passes/SrtWalker.h')
          foreach ($path in $pr599Wins) { git restore --source=HEAD --staged --worktree -- $path }
          git add -A
          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) { Write-Error "Unresolved merge conflicts remain: $unmerged"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Apply Build32 keeper and B39 sampled format backing fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # Return to Build32 + PR506/VMA keeper. B33-B38 experiments are excluded.
          draw = Path('src/graphics/host_gpu/renderer/renderDraw.cpp')
          s = draw.read_text(encoding='utf-8')
          needle = '\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'
          replacement = '\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\n// Build32 keeper: preserve depth/shadow producer passes.\n#if defined(KYTY_DS_SAFE_POSTFX_PERF)\n\tif (!state.depth_info.image_id && state.color_count == 1 && state.ps_active) {\n\t\tconst auto& extent = state.color_info[0].desc.info.extent;\n\t\tconst bool likely_small_postfx = extent.width >= 64 && extent.height >= 64 && extent.width <= 1024 && extent.height <= 1024;\n\t\tif (likely_small_postfx) { return false; }\n\t}\n#endif\n\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'
          if needle not in s: raise SystemExit('render anchor not found')
          draw.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

          p = Path('src/graphics/host_gpu/renderer/cache/streamBuffer.cpp')
          s = p.read_text(encoding='utf-8')
          old = '\tconst bool with_bda = bool(flags & vk::BufferUsageFlagBits::eShaderDeviceAddress);\n\tconst VmaAllocationCreateFlags bda_flag =\n\t    with_bda ? VMA_ALLOCATION_CREATE_DEDICATED_MEMORY_BIT : 0;\n\tVmaAllocationCreateInfo allocation_info {};'
          new = '\tconst bool with_bda = bool(flags & vk::BufferUsageFlagBits::eShaderDeviceAddress);\n#if defined(KYTY_DS_VMA_SUBALLOC_PERF)\n\tconst VmaAllocationCreateFlags bda_flag =\n\t    (with_bda && size >= (16ull * 1024 * 1024)) ? VMA_ALLOCATION_CREATE_DEDICATED_MEMORY_BIT : 0;\n#else\n\tconst VmaAllocationCreateFlags bda_flag =\n\t    with_bda ? VMA_ALLOCATION_CREATE_DEDICATED_MEMORY_BIT : 0;\n#endif\n\tVmaAllocationCreateInfo allocation_info {};'
          if old not in s: raise SystemExit('VMA anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # B39: SameBacking accepts any Vulkan-compatible format class and the candidate loop
          # lets the last compatible image win. A guest range can therefore oscillate between an
          # exact-format native image and a compatible reinterpretation depending on cache order.
          # For sampled textures only, prefer an exact pixel-format backing when one exists while
          # retaining the compatible fallback required by normal aliasing. This avoids B38's broad
          # layout rejection and should preserve the Build32 performance behavior.
          p = Path('src/graphics/host_gpu/renderer/cache/textureCache.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''\t\tfor (const auto id: candidates) {\n\t\t\tconst auto& image = m_slot_images[id];\n\t\t\tif (SameBacking(image.info, desc.info, exact_format)) {\n\t\t\t\tresult = id;\n\t\t\t}\n\t\t}'''
          new = '''\t\tfor (const auto id: candidates) {\n\t\t\tconst auto& image = m_slot_images[id];\n\t\t\tif (SameBacking(image.info, desc.info, exact_format)) {\n#if defined(KYTY_DS_PREFER_EXACT_SAMPLED_FORMAT)\n\t\t\t\tif (desc.type == BindingType::Texture) {\n\t\t\t\t\tconst bool candidate_exact = image.info.pixel_format == desc.info.pixel_format;\n\t\t\t\t\tconst bool current_exact = result &&\n\t\t\t\t\t    m_slot_images[result].info.pixel_format == desc.info.pixel_format;\n\t\t\t\t\tif (current_exact && !candidate_exact) {\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\t}\n\t\t\t\t}\n#endif\n\t\t\t\tresult = id;\n\t\t\t}\n\t\t}'''
          if old not in s: raise SystemExit('SameBacking candidate anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") { vcpkg install glslang[tools,opt]:x64-windows }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure Release LTO Build39 sampled format fix
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_FLAGS="/DNOMINMAX" -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc /DKYTY_DS_SAFE_POSTFX_PERF=1 /DKYTY_DS_VMA_SUBALLOC_PERF=1 /DKYTY_DS_PREFER_EXACT_SAMPLED_FORMAT=1" -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 -DKYTY_RELEASE_TAG=KytyPS5-B39-SAMPLED-FORMAT-FLICKER-LTO -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel > b39-sampled-format-flicker-build.log 2>&1
          set "rc=%ERRORLEVEL%"
          type b39-sampled-format-flicker-build.log
          exit /b %rc%
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B39-Sampled-Format-Flicker-Windows-build-log
          path: b39-sampled-format-flicker-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-B39-SAMPLED-FORMAT-FLICKER-LTO
          path: _Build/windows/install/**
          if-no-files-found: error
          retention-days: 90
