name: PR599 + PR506 Demon Souls Buffer Allocation Performance Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr599-pr506-lighting-perf-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout frozen PR599 source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: fbcc0c6914a9e76ae5dc52358b935657dcfcb7d7
          submodules: recursive
          fetch-depth: 0

      - name: Apply PR506 FPS optimizations
        shell: pwsh
        run: |
          git config user.name "MILLYONYT CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Techx3/KytyPS5.git a6ebfb5208b61852b4e3f34c03bda677f2861533
          cmd /c "git cherry-pick --no-commit a6ebfb5208b61852b4e3f34c03bda677f2861533 || exit /b 0"
          $pr599Wins = @(
            'src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp',
            'src/graphics/host_gpu/renderer/renderCompute.cpp',
            'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp',
            'src/graphics/shader/recompiler/ir/passes/SrtWalker.h'
          )
          foreach ($path in $pr599Wins) { git restore --source=HEAD --staged --worktree -- $path }
          git add -A
          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) { Write-Error "Unresolved merge conflicts remain: $unmerged"; exit 1 }
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src
          if ($LASTEXITCODE -eq 0) { Write-Error "Unresolved merge markers remain"; exit 1 }
          if ($LASTEXITCODE -ne 1) { Write-Error "git grep conflict-marker check failed with exit code $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Apply 10-12-18 baseline and small-buffer allocation optimization
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          draw = Path('src/graphics/host_gpu/renderer/renderDraw.cpp')
          s = draw.read_text(encoding='utf-8')
          needle = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          replacement = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\n#if defined(KYTY_DS_SELECTIVE_SHADOW_PERF)\n\tif (state.depth_info.image_id && state.color_count == 0) {\n\t\tconst auto& extent = state.depth_info.desc.info.extent;\n\t\tconst bool likely_large_shadow_map = extent.width == extent.height && extent.width >= 1024 && extent.width <= 4096;\n\t\tif (likely_large_shadow_map) { return false; }\n\t}\n#endif\n\n#if defined(KYTY_DS_SAFE_POSTFX_PERF)\n\tif (!state.depth_info.image_id && state.color_count == 1 && state.ps_active) {\n\t\tconst auto& extent = state.color_info[0].desc.info.extent;\n\t\tconst bool likely_small_postfx = extent.width >= 64 && extent.height >= 64 && extent.width <= 1024 && extent.height <= 1024;\n\t\tif (likely_small_postfx) { return false; }\n\t}\n#endif\n\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          if needle not in s: raise SystemExit('performance baseline anchor not found')
          draw.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

          p = Path('src/graphics/host_gpu/renderer/cache/bufferCache.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''BufferId BufferCache::CreateBuffer(uint64_t vaddr, uint64_t size) {\n\tEXIT_IF(m_scheduler.Current().IsInvalid());\n\tconst auto end = (vaddr + size + CACHING_PAGESIZE - 1) & ~(CACHING_PAGESIZE - 1);\n\tvaddr &= ~(CACHING_PAGESIZE - 1);\n\tsize               = end - vaddr;\n\tconst auto overlap = ResolveOverlaps(vaddr, size);'''
          new = '''BufferId BufferCache::CreateBuffer(uint64_t vaddr, uint64_t size) {\n\tEXIT_IF(m_scheduler.Current().IsInvalid());\n#if defined(KYTY_DS_BUFFER_ALLOC_PERF)\n\t// Profiling showed that synchronous VMA/Vulkan DeviceLocal allocation accounts for\n\t// essentially all long CreateBuffer stalls. Demon Souls frequently requests tiny\n\t// 16-byte to few-KiB ranges that otherwise become separate 16-KiB allocations.\n\t// Give new, non-overlapping small ranges a bounded 256-KiB forward envelope so\n\t// subsequent nearby requests hit the same cached buffer instead of entering VMA.\n\t// ResolveOverlaps still owns correctness when an existing resource intersects it.\n\tconst uint64_t requested_end = vaddr + size;\n\tconst uint64_t requested_page_begin = vaddr & ~(CACHING_PAGESIZE - 1);\n\tconst uint64_t requested_page_end = (requested_end + CACHING_PAGESIZE - 1) & ~(CACHING_PAGESIZE - 1);\n\tif (size <= CACHING_PAGESIZE) {\n\t\tconst auto* first_owner = m_page_table.Find(requested_page_begin >> PageTable::kPageBits);\n\t\tconst auto* last_owner = m_page_table.Find((requested_page_end - 1) >> PageTable::kPageBits);\n\t\tif ((first_owner == nullptr || !*first_owner) && (last_owner == nullptr || !*last_owner)) {\n\t\t\tconstexpr uint64_t SmallBufferEnvelope = 256ull * 1024;\n\t\t\tconst uint64_t envelope_end = (requested_page_begin + SmallBufferEnvelope) & ~(CACHING_PAGESIZE - 1);\n\t\t\tbool envelope_clear = true;\n\t\t\tfor (uint64_t page = requested_page_begin >> PageTable::kPageBits;\n\t\t\t     page < (envelope_end >> PageTable::kPageBits); ++page) {\n\t\t\t\tconst auto* owner = m_page_table.Find(page);\n\t\t\t\tif (owner != nullptr && *owner) { envelope_clear = false; break; }\n\t\t\t}\n\t\t\tif (envelope_clear) { size = envelope_end - vaddr; }\n\t\t}\n\t}\n#endif\n\tconst auto end = (vaddr + size + CACHING_PAGESIZE - 1) & ~(CACHING_PAGESIZE - 1);\n\tvaddr &= ~(CACHING_PAGESIZE - 1);\n\tsize               = end - vaddr;\n\tconst auto overlap = ResolveOverlaps(vaddr, size);'''
          if old not in s: raise SystemExit('CreateBuffer anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          git diff -- src/graphics/host_gpu/renderer/renderDraw.cpp src/graphics/host_gpu/renderer/cache/bufferCache.cpp

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") { vcpkg install glslang[tools,opt]:x64-windows }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Release LTO buffer allocation performance build
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_FLAGS="/DNOMINMAX" -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc /DKYTY_DS_SELECTIVE_SHADOW_PERF=1 /DKYTY_DS_SAFE_POSTFX_PERF=1 /DKYTY_DS_BUFFER_ALLOC_PERF=1" -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 -DKYTY_RELEASE_TAG=KytyPS5-PR599-PR506-DS-BUFFER-ALLOC-LTO -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel > buffer-alloc-build.log 2>&1
          set "rc=%ERRORLEVEL%"
          type buffer-alloc-build.log
          exit /b %rc%
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buffer-Alloc-Windows-build-log
          path: buffer-alloc-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-PR599-PR506-DS-BUFFER-ALLOC-LTO
          path: _Build/windows/install/**
          if-no-files-found: error
