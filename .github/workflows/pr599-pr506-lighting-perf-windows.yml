name: PR599 + PR506 Demon Souls FindBuffer Deep Profiling Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr599-pr506-lighting-perf-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout frozen PR599 source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: fbcc0c6914a9e76ae5dc52358b935657dcfcb7d7
          submodules: recursive
          fetch-depth: 0

      - name: Apply PR506 FPS optimizations
        shell: pwsh
        run: |
          git config user.name "MILLYONYT CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Techx3/KytyPS5.git a6ebfb5208b61852b4e3f34c03bda677f2861533
          cmd /c "git cherry-pick --no-commit a6ebfb5208b61852b4e3f34c03bda677f2861533 || exit /b 0"
          $pr599Wins = @(
            'src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp',
            'src/graphics/host_gpu/renderer/renderCompute.cpp',
            'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp',
            'src/graphics/shader/recompiler/ir/passes/SrtWalker.h'
          )
          foreach ($path in $pr599Wins) { git restore --source=HEAD --staged --worktree -- $path }
          git add -A
          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) { Write-Error "Unresolved merge conflicts remain: $unmerged"; exit 1 }
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src
          if ($LASTEXITCODE -eq 0) { Write-Error "Unresolved merge markers remain"; exit 1 }
          if ($LASTEXITCODE -ne 1) { Write-Error "git grep conflict-marker check failed with exit code $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Apply 10-12-18 baseline and deep FindBuffer profiler
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          draw = Path('src/graphics/host_gpu/renderer/renderDraw.cpp')
          s = draw.read_text(encoding='utf-8')
          needle = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          replacement = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\n#if defined(KYTY_DS_SELECTIVE_SHADOW_PERF)\n\tif (state.depth_info.image_id && state.color_count == 0) {\n\t\tconst auto& extent = state.depth_info.desc.info.extent;\n\t\tconst bool likely_large_shadow_map = extent.width == extent.height && extent.width >= 1024 && extent.width <= 4096;\n\t\tif (likely_large_shadow_map) { return false; }\n\t}\n#endif\n\n#if defined(KYTY_DS_SAFE_POSTFX_PERF)\n\tif (!state.depth_info.image_id && state.color_count == 1 && state.ps_active) {\n\t\tconst auto& extent = state.color_info[0].desc.info.extent;\n\t\tconst bool likely_small_postfx = extent.width >= 64 && extent.height >= 64 && extent.width <= 1024 && extent.height <= 1024;\n\t\tif (likely_small_postfx) { return false; }\n\t}\n#endif\n\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          if needle not in s: raise SystemExit('performance baseline anchor not found')
          draw.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

          p = Path('src/graphics/host_gpu/renderer/cache/bufferCache.cpp')
          s = p.read_text(encoding='utf-8')
          inc = '#include <algorithm>\n'
          if inc not in s: raise SystemExit('buffer profiler include anchor not found')
          s = s.replace(inc, inc + '#include <atomic>\n#include <chrono>\n#include <cstdio>\n', 1)

          old = '''BufferId BufferCache::FindBuffer(uint64_t vaddr, uint64_t size) {\n\tif (vaddr == 0) {\n\t\treturn NULL_BUFFER_ID;\n\t}\n\tif (!GuestRange {vaddr, size}.Valid()) {\n\t\tEXIT("BufferCache: invalid buffer discovery request\\n");\n\t}\n\tconst auto* owner = m_page_table.Find(vaddr >> PageTable::kPageBits);\n\tif (owner != nullptr && *owner) {\n\t\tauto& buffer = m_slot_buffers[*owner];\n\t\tif (buffer.IsInBounds(vaddr, size)) {\n\t\t\treturn *owner;\n\t\t}\n\t}\n\treturn CreateBuffer(vaddr, size);\n}'''
          new = '''BufferId BufferCache::FindBuffer(uint64_t vaddr, uint64_t size) {\n\tif (vaddr == 0) { return NULL_BUFFER_ID; }\n\tif (!GuestRange {vaddr, size}.Valid()) { EXIT("BufferCache: invalid buffer discovery request\\n"); }\n#if defined(KYTY_DS_FINDBUFFER_PROFILE)\n\tusing Clock = std::chrono::steady_clock;\n\tstatic std::atomic<uint64_t> calls {0}, hits {0}, misses {0}, lookup_ns {0}, create_ns {0}, worst_create_ns {0};\n\tconst auto t0 = Clock::now();\n#endif\n\tconst auto* owner = m_page_table.Find(vaddr >> PageTable::kPageBits);\n\tif (owner != nullptr && *owner) {\n\t\tauto& buffer = m_slot_buffers[*owner];\n\t\tif (buffer.IsInBounds(vaddr, size)) {\n#if defined(KYTY_DS_FINDBUFFER_PROFILE)\n\t\t\tconst auto t1 = Clock::now();\n\t\t\tlookup_ns.fetch_add(static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::nanoseconds>(t1-t0).count()), std::memory_order_relaxed);\n\t\t\thits.fetch_add(1, std::memory_order_relaxed);\n\t\t\tconst auto n = calls.fetch_add(1, std::memory_order_relaxed) + 1;\n\t\t\tif ((n & 4095u) == 0) std::printf("DS_FINDBUFFER calls=%llu hits=%llu misses=%llu lookup_ms=%.3f create_ms=%.3f worst_create_ms=%.3f\\n", static_cast<unsigned long long>(n), static_cast<unsigned long long>(hits.exchange(0)), static_cast<unsigned long long>(misses.exchange(0)), lookup_ns.exchange(0)/1000000.0, create_ns.exchange(0)/1000000.0, worst_create_ns.exchange(0)/1000000.0);\n#endif\n\t\t\treturn *owner;\n\t\t}\n\t}\n#if defined(KYTY_DS_FINDBUFFER_PROFILE)\n\tconst auto t1 = Clock::now();\n\tlookup_ns.fetch_add(static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::nanoseconds>(t1-t0).count()), std::memory_order_relaxed);\n\tconst auto tc0 = Clock::now();\n#endif\n\tconst auto id = CreateBuffer(vaddr, size);\n#if defined(KYTY_DS_FINDBUFFER_PROFILE)\n\tconst auto tc1 = Clock::now();\n\tconst auto cns = static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::nanoseconds>(tc1-tc0).count());\n\tcreate_ns.fetch_add(cns, std::memory_order_relaxed);\n\tmisses.fetch_add(1, std::memory_order_relaxed);\n\tauto worst = worst_create_ns.load(std::memory_order_relaxed);\n\twhile (cns > worst && !worst_create_ns.compare_exchange_weak(worst, cns, std::memory_order_relaxed)) {}\n\tif (cns >= 1000000ull) std::printf("DS_FINDBUFFER_STALL create_ms=%.3f addr=0x%016llx size=0x%llx\\n", cns/1000000.0, static_cast<unsigned long long>(vaddr), static_cast<unsigned long long>(size));\n\tconst auto n = calls.fetch_add(1, std::memory_order_relaxed) + 1;\n\tif ((n & 4095u) == 0) std::printf("DS_FINDBUFFER calls=%llu hits=%llu misses=%llu lookup_ms=%.3f create_ms=%.3f worst_create_ms=%.3f\\n", static_cast<unsigned long long>(n), static_cast<unsigned long long>(hits.exchange(0)), static_cast<unsigned long long>(misses.exchange(0)), lookup_ns.exchange(0)/1000000.0, create_ns.exchange(0)/1000000.0, worst_create_ns.exchange(0)/1000000.0);\n#endif\n\treturn id;\n}'''
          if old not in s: raise SystemExit('FindBuffer anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          git diff -- src/graphics/host_gpu/renderer/renderDraw.cpp src/graphics/host_gpu/renderer/cache/bufferCache.cpp

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") { vcpkg install glslang[tools,opt]:x64-windows }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Release LTO deep profiler
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_FLAGS="/DNOMINMAX" -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc /DKYTY_DS_SELECTIVE_SHADOW_PERF=1 /DKYTY_DS_SAFE_POSTFX_PERF=1 /DKYTY_DS_FINDBUFFER_PROFILE=1" -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 -DKYTY_RELEASE_TAG=KytyPS5-PR599-PR506-DS-FINDBUFFER-PROFILE-LTO -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel > findbuffer-profile-build.log 2>&1
          set "rc=%ERRORLEVEL%"
          type findbuffer-profile-build.log
          exit /b %rc%
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FindBuffer-Profile-Windows-build-log
          path: findbuffer-profile-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-PR599-PR506-DS-FINDBUFFER-PROFILE-LTO
          path: _Build/windows/install/**
          if-no-files-found: error
