name: PR599 + PR506 Demon Souls Binding Breakdown Profiling Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pr599-pr506-lighting-perf-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout frozen PR599 source
        uses: actions/checkout@v4
        with:
          repository: chenxiao07/KytyPS5
          ref: fbcc0c6914a9e76ae5dc52358b935657dcfcb7d7
          submodules: recursive
          fetch-depth: 0

      - name: Apply PR506 FPS optimizations
        shell: pwsh
        run: |
          git config user.name "MILLYONYT CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Techx3/KytyPS5.git a6ebfb5208b61852b4e3f34c03bda677f2861533
          cmd /c "git cherry-pick --no-commit a6ebfb5208b61852b4e3f34c03bda677f2861533 || exit /b 0"
          $pr599Wins = @(
            'src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp',
            'src/graphics/host_gpu/renderer/renderCompute.cpp',
            'src/graphics/shader/recompiler/ir/passes/ResourceMaterialization.cpp',
            'src/graphics/shader/recompiler/ir/passes/SrtWalker.h'
          )
          foreach ($path in $pr599Wins) { git restore --source=HEAD --staged --worktree -- $path }
          git add -A
          $unmerged = git diff --name-only --diff-filter=U
          if ($unmerged) { Write-Error "Unresolved merge conflicts remain: $unmerged"; exit 1 }
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- src
          if ($LASTEXITCODE -eq 0) { Write-Error "Unresolved merge markers remain"; exit 1 }
          if ($LASTEXITCODE -ne 1) { Write-Error "git grep conflict-marker check failed with exit code $LASTEXITCODE"; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Apply performance baseline and binding-stage profiler
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # Preserve current 10/12/18 performance baseline: selective shadows + conservative PostFX.
          draw = Path('src/graphics/host_gpu/renderer/renderDraw.cpp')
          s = draw.read_text(encoding='utf-8')
          needle = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          replacement = '''\tstate.ps_active       = DrawHasActivePixelShader(buffer);\n\n#if defined(KYTY_DS_SELECTIVE_SHADOW_PERF)\n\tif (state.depth_info.image_id && state.color_count == 0) {\n\t\tconst auto& extent = state.depth_info.desc.info.extent;\n\t\tconst bool likely_large_shadow_map = extent.width == extent.height && extent.width >= 1024 &&\n\t\t                                    extent.width <= 4096;\n\t\tif (likely_large_shadow_map) { return false; }\n\t}\n#endif\n\n#if defined(KYTY_DS_SAFE_POSTFX_PERF)\n\tif (!state.depth_info.image_id && state.color_count == 1 && state.ps_active) {\n\t\tconst auto& extent = state.color_info[0].desc.info.extent;\n\t\tconst bool likely_small_postfx = extent.width >= 64 && extent.height >= 64 &&\n\t\t                                  extent.width <= 1024 && extent.height <= 1024;\n\t\tif (likely_small_postfx) { return false; }\n\t}\n#endif\n\n\tif (state.color_count == 0 && !state.depth_info.image_id && !state.ps_active) {'''
          if needle not in s: raise SystemExit('performance baseline patch anchor not found')
          draw.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

          # Break PrepareGraphicsBindings into the exact stages implicated by the first profile.
          p = Path('src/graphics/host_gpu/renderer/pipeline/descriptors.cpp')
          s = p.read_text(encoding='utf-8')
          inc = '#include <atomic>\n'
          if inc not in s: raise SystemExit('descriptor include anchor not found')
          s = s.replace(inc, inc + '#include <chrono>\n#include <cstdio>\n', 1)

          old = '''RenderExecutor::GraphicsBindings\nRenderExecutor::PrepareGraphicsBindings(const ShaderStageRuntime& vertex,\n                                        const ShaderStageRuntime& pixel, bool pixel_active) {\n\tGraphicsBindings bindings {\n\t    .vertex = PrepareBindings(vertex),\n\t};\n\tif (pixel_active) {\n\t\tbindings.pixel.emplace(PrepareBindings(pixel));\n\t}\n\tFindBuffers(bindings.vertex);\n\tif (bindings.pixel) {\n\t\tFindBuffers(*bindings.pixel);\n\t}\n\tPrepareBdaBindings(bindings.vertex, bindings.pixel ? &*bindings.pixel : nullptr);\n\tRebindBuffers(bindings.vertex);\n\tif (bindings.pixel) {\n\t\tRebindBuffers(*bindings.pixel);\n\t}\n\tRebindImages(bindings.vertex);\n\tif (bindings.pixel) {\n\t\tRebindImages(*bindings.pixel);\n\t}\n\treturn bindings;\n}'''
          new = '''RenderExecutor::GraphicsBindings\nRenderExecutor::PrepareGraphicsBindings(const ShaderStageRuntime& vertex,\n                                        const ShaderStageRuntime& pixel, bool pixel_active) {\n#if defined(KYTY_DS_BINDING_PROFILE)\n\tusing Clock = std::chrono::steady_clock;\n\tstatic std::atomic<uint64_t> calls {0}, prepare_ns {0}, find_ns {0}, bda_ns {0},\n\t                             buffers_ns {0}, images_ns {0};\n\tconst auto t0 = Clock::now();\n#endif\n\tGraphicsBindings bindings {\n\t    .vertex = PrepareBindings(vertex),\n\t};\n\tif (pixel_active) {\n\t\tbindings.pixel.emplace(PrepareBindings(pixel));\n\t}\n#if defined(KYTY_DS_BINDING_PROFILE)\n\tconst auto t1 = Clock::now();\n#endif\n\tFindBuffers(bindings.vertex);\n\tif (bindings.pixel) {\n\t\tFindBuffers(*bindings.pixel);\n\t}\n#if defined(KYTY_DS_BINDING_PROFILE)\n\tconst auto t2 = Clock::now();\n#endif\n\tPrepareBdaBindings(bindings.vertex, bindings.pixel ? &*bindings.pixel : nullptr);\n#if defined(KYTY_DS_BINDING_PROFILE)\n\tconst auto t3 = Clock::now();\n#endif\n\tRebindBuffers(bindings.vertex);\n\tif (bindings.pixel) {\n\t\tRebindBuffers(*bindings.pixel);\n\t}\n#if defined(KYTY_DS_BINDING_PROFILE)\n\tconst auto t4 = Clock::now();\n#endif\n\tRebindImages(bindings.vertex);\n\tif (bindings.pixel) {\n\t\tRebindImages(*bindings.pixel);\n\t}\n#if defined(KYTY_DS_BINDING_PROFILE)\n\tconst auto t5 = Clock::now();\n\tconst auto ns = [](auto a, auto b) {\n\t\treturn static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::nanoseconds>(b - a).count());\n\t};\n\tprepare_ns.fetch_add(ns(t0, t1), std::memory_order_relaxed);\n\tfind_ns.fetch_add(ns(t1, t2), std::memory_order_relaxed);\n\tbda_ns.fetch_add(ns(t2, t3), std::memory_order_relaxed);\n\tbuffers_ns.fetch_add(ns(t3, t4), std::memory_order_relaxed);\n\timages_ns.fetch_add(ns(t4, t5), std::memory_order_relaxed);\n\tconst auto n = calls.fetch_add(1, std::memory_order_relaxed) + 1;\n\tif ((n & 255u) == 0) {\n\t\tstd::printf("DS_BIND_PROFILE calls=%llu prepare_ms=%.3f find_ms=%.3f bda_ms=%.3f buffers_ms=%.3f images_ms=%.3f\\n",\n\t\t            static_cast<unsigned long long>(n), prepare_ns.exchange(0) / 1000000.0,\n\t\t            find_ns.exchange(0) / 1000000.0, bda_ns.exchange(0) / 1000000.0,\n\t\t            buffers_ns.exchange(0) / 1000000.0, images_ns.exchange(0) / 1000000.0);\n\t}\n#endif\n\treturn bindings;\n}'''
          if old not in s: raise SystemExit('PrepareGraphicsBindings profiler anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          git diff -- src/graphics/host_gpu/renderer/renderDraw.cpp src/graphics/host_gpu/renderer/pipeline/descriptors.cpp

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt
      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") { vcpkg install glslang[tools,opt]:x64-windows }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Release LTO binding profiling build
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_FLAGS="/DNOMINMAX" ^
            -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc /DKYTY_DS_SELECTIVE_SHADOW_PERF=1 /DKYTY_DS_SAFE_POSTFX_PERF=1 /DKYTY_DS_BINDING_PROFILE=1" ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=MILLYONYT/KytyPS5 ^
            -DKYTY_RELEASE_TAG=KytyPS5-PR599-PR506-DS-BIND-PROFILE-LTO ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher --parallel > pr599-pr506-bind-profile-build.log 2>&1
          set "rc=%ERRORLEVEL%"
          type pr599-pr506-bind-profile-build.log
          exit /b %rc%
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR599-PR506-Binding-Profile-Windows-build-log
          path: pr599-pr506-bind-profile-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install
        shell: cmd
        run: cmake --install _Build/windows --prefix _Build/windows/install
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-PR599-PR506-DS-BIND-PROFILE-LTO
          path: _Build/windows/install/**
          if-no-files-found: error
